# Local development: Postgres from docker-compose on localhost.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    url: jdbc:postgresql://localhost:5433/pokedex
    username: pokedex
    password: pokedex

pokedex:
  security:
    # Development-only secret. Never used by the docker profile.
    jwt-secret: ${JWT_SECRET:local-development-secret-do-not-use-in-production-32b}

server:
  port: 8090
